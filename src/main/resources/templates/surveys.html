<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的问卷 - 问卷系统</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="container-wide">
    <div class="topbar">
        <div class="brand">问卷系统 <a href="/library" style="margin-left:16px;font-size:14px;font-weight:normal">题库</a></div>
        <div class="user-area" id="userArea"></div>
    </div>
    <div id="notice" class="notice"></div>

    <div class="card">
        <h3 style="margin-bottom:14px">新建问卷</h3>
        <form id="createForm" class="row-between" style="align-items:flex-end">
            <div class="field" style="flex:2;margin-bottom:0">
                <label>标题</label>
                <input type="text" id="newTitle" required placeholder="例如：课程满意度调查">
            </div>
            <div class="field" style="flex:3;margin-bottom:0">
                <label>说明（可选）</label>
                <input type="text" id="newDesc" placeholder="一句话介绍这份问卷">
            </div>
            <button type="submit" class="btn btn-primary">创建</button>
        </form>
    </div>

    <div id="list"></div>
</div>
<script src="/js/common.js"></script>
<script>
    requireLogin();
    renderUserArea();

    const STATUS_TEXT = { DRAFT: '草稿', PUBLISHED: '已发布', CLOSED: '已关闭' };

    async function load() {
        const list = await api('/api/surveys');
        const box = document.getElementById('list');
        if (!list.length) {
            box.innerHTML = '<div class="card muted center">还没有问卷，先创建一份吧</div>';
            return;
        }
        box.innerHTML = list.map(s => {
            const shareUrl = location.origin + '/s/' + (s.shareCode || '');
            return `<div class="card">
                <div class="row-between">
                    <div>
                        <strong>${escapeHtml(s.title)}</strong>
                        <span class="tag ${s.status === 'PUBLISHED' ? '' : 'gray'}" style="margin-left:8px">${STATUS_TEXT[s.status]}</span>
                        <div class="muted" style="margin-top:4px">创建于 ${new Date(s.createdAt).toLocaleString('zh-CN')}</div>
                        ${s.status === 'PUBLISHED' ? `<div class="muted" style="margin-top:4px">分享链接：<a href="${shareUrl}" target="_blank">${shareUrl}</a></div>` : ''}
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <a class="btn btn-sm" href="/surveys/${s.id}/edit">${s.status === 'DRAFT' ? '编辑' : '查看'}</a>
                        ${s.status === 'DRAFT' ? `<button class="btn btn-sm btn-primary" onclick="publish('${s.id}')">发布</button>` : ''}
                        ${s.status === 'PUBLISHED' ? `<a class="btn btn-sm" href="/surveys/${s.id}/stats">统计</a>
                            <button class="btn btn-sm" onclick="closeSurvey('${s.id}')">关闭</button>` : ''}
                        <button class="btn btn-sm btn-danger" onclick="removeSurvey('${s.id}')">删除</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function publish(id) {
        if (!confirm('发布后题目结构将锁定，确定发布？')) return;
        try { await api(`/api/surveys/${id}/publish`, { method: 'POST' }); load(); }
        catch (e) { showNotice(e.message); }
    }

    async function closeSurvey(id) {
        if (!confirm('关闭后将停止收集答卷，确定关闭？')) return;
        try { await api(`/api/surveys/${id}/close`, { method: 'POST' }); load(); }
        catch (e) { showNotice(e.message); }
    }

    async function removeSurvey(id) {
        if (!confirm('删除后问卷及其答卷数据将一并删除，确定？')) return;
        try { await api(`/api/surveys/${id}`, { method: 'DELETE' }); load(); }
        catch (e) { showNotice(e.message); }
    }

    document.getElementById('createForm').onsubmit = async (e) => {
        e.preventDefault();
        try {
            const s = await api('/api/surveys', {
                method: 'POST',
                body: JSON.stringify({
                    title: document.getElementById('newTitle').value.trim(),
                    description: document.getElementById('newDesc').value.trim()
                })
            });
            location.href = `/surveys/${s.id}/edit`;
        } catch (err) { showNotice(err.message); }
    };

    load().catch(e => showNotice(e.message));
</script>
</body>
</html>
