<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 问卷系统</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .auth-card { max-width: 420px; margin: 80px auto 0; }
        .tabs { display: flex; gap: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
        .tabs button {
            background: none; border: none; padding: 10px 4px; font-size: 16px;
            color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
        }
        .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="card auth-card">
        <div class="tabs">
            <button id="tabLogin" class="active">登录</button>
            <button id="tabRegister">注册</button>
        </div>
        <div id="notice" class="notice"></div>
        <form id="authForm">
            <div class="field">
                <label>用户名</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">登录</button>
        </form>
    </div>
</div>
<script src="/js/common.js"></script>
<script>
    if (TokenStore.get()) location.href = '/surveys';

    let mode = 'login';
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const submitBtn = document.getElementById('submitBtn');

    function switchMode(m) {
        mode = m;
        tabLogin.classList.toggle('active', m === 'login');
        tabRegister.classList.toggle('active', m === 'register');
        submitBtn.textContent = m === 'login' ? '登录' : '注册';
    }
    tabLogin.onclick = () => switchMode('login');
    tabRegister.onclick = () => switchMode('register');

    document.getElementById('authForm').onsubmit = async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        try {
            const data = await api('/api/auth/' + mode, {
                method: 'POST',
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            TokenStore.set(data.token);
            localStorage.setItem('username', data.username);
            location.href = '/surveys';
        } catch (err) {
            showNotice(err.message);
        } finally {
            submitBtn.disabled = false;
        }
    };
</script>
</body>
</html>
