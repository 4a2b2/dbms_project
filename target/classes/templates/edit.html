<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编辑问卷</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="container-wide">
      <div class="topbar">
        <div class="brand"><a href="/surveys">← 返回列表</a></div>
        <div class="user-area" id="userArea"></div>
      </div>
      <div id="notice" class="notice"></div>
      <div id="app"></div>
    </div>
    <input type="hidden" id="surveyId" th:value="${surveyId}" />
    <div
      id="libModal"
      style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;overflow-y:auto"
    >
      <div class="card" style="max-width:720px;margin:60px auto 40px">
        <div class="row-between">
          <h3 style="margin:0">从题库选择</h3>
          <button class="btn btn-sm" onclick="closeLibrary()">关闭</button>
        </div>
        <p class="muted" style="margin:8px 0 0">
          选用后题目内容会复制进问卷并引用当前版本；在问卷中修改自己的题会自动产生新版本。
        </p>
        <div id="libList" style="margin-top:14px">加载中…</div>
      </div>
    </div>
    <script src="/js/common.js"></script>
    <script>
      const SURVEY_ID = document.getElementById("surveyId").value;
      requireLogin();
      renderUserArea();

      const TYPE_TEXT = {
        single: "单选题",
        multiple: "多选题",
        text: "文本题",
        number: "数字题",
      };
      const OPS_BY_TYPE = {
        single: [
          { v: "eq", t: "选中" },
          { v: "in", t: "选中其中之一" },
        ],
        multiple: [
          { v: "contains", t: "包含选项" },
          { v: "containsAll", t: "同时包含" },
        ],
        number: [
          { v: "eq", t: "等于" },
          { v: "gt", t: "大于" },
          { v: "gte", t: "大于等于" },
          { v: "lt", t: "小于" },
          { v: "lte", t: "小于等于" },
          { v: "between", t: "介于" },
        ],
      };

      let survey = null;
      const isDraft = () => survey.status === "DRAFT";
      const newId = () => Math.random().toString(36).slice(2, 10);

      /* ========== 渲染 ========== */

      function render() {
        const scrollY = window.scrollY;
        document.title = survey.title + " - 编辑";
        const ro = isDraft() ? "" : "disabled";
        document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="row-between">
                    <h2 style="margin:0">${escapeHtml(survey.title)}</h2>
                    <span class="tag ${isDraft() ? "gray" : ""}">${{ DRAFT: "草稿", PUBLISHED: "已发布", CLOSED: "已关闭" }[survey.status]}</span>
                </div>
                ${
                  !isDraft()
                    ? `<p class="muted" style="margin:8px 0 0">已发布，题目结构锁定；仍可修改标题、说明与设置。
                    分享链接：<a href="/s/${survey.shareCode}" target="_blank">${location.origin}/s/${survey.shareCode}</a></p>`
                    : ""
                }
            </div>

            <div class="card">
                <h3>基本信息</h3>
                <div class="field"><label>标题</label><input type="text" id="fTitle" value="${escapeHtml(survey.title)}"></div>
                <div class="field"><label>说明</label><textarea id="fDesc">${escapeHtml(survey.description || "")}</textarea></div>
                <h3>设置</h3>
                <div class="row-between" style="justify-content:flex-start;gap:24px">
                    <label><input type="checkbox" id="fAnon" ${survey.settings.allowAnonymous ? "checked" : ""} style="width:auto"> 允许匿名填写</label>
                    <label><input type="checkbox" id="fMulti" ${survey.settings.allowMultiple ? "checked" : ""} style="width:auto"> 允许同一用户多次提交</label>
                </div>
                <div class="field" style="margin-top:14px;max-width:280px">
                    <label>截止时间（留空不限）</label>
                    <input type="datetime-local" id="fDeadline" value="${toLocalInput(survey.settings.deadline)}">
                </div>
            </div>

            <div class="card">
                <div class="row-between">
                    <h3 style="margin:0">题目（${survey.questions.length}）</h3>
                    ${
                      isDraft()
                        ? `<div style="display:flex;gap:8px">
                        <button class="btn btn-sm" onclick="addQuestion('single')">+ 单选</button>
                        <button class="btn btn-sm" onclick="addQuestion('multiple')">+ 多选</button>
                        <button class="btn btn-sm" onclick="addQuestion('text')">+ 文本</button>
                        <button class="btn btn-sm" onclick="addQuestion('number')">+ 数字</button>
                        <button class="btn btn-sm" onclick="openLibrary()">从题库选择</button>
                    </div>`
                        : ""
                    }
                </div>
                <div id="questionList" style="margin-top:16px">${survey.questions.map((q, i) => questionHtml(q, i, ro)).join("")}</div>
            </div>

            <div class="card">
                <div class="row-between">
                    <h3 style="margin:0">跳转逻辑（${survey.logic.length}）</h3>
                    ${isDraft() ? `<button class="btn btn-sm" onclick="addRule()">+ 添加规则</button>` : ""}
                </div>
                <p class="muted" style="margin:6px 0 12px">当某题的答案满足条件时，跳转到后面的指定题目或直接结束。只能向后跳。</p>
                <div id="ruleList">${survey.logic.map((r, i) => ruleHtml(r, i, ro)).join("")}</div>
            </div>

            <div class="card row-between">
                <div class="muted" id="saveHint"></div>
                <div style="display:flex;gap:10px">
                    <button class="btn btn-primary" onclick="save()">保存</button>
                    ${isDraft() ? `<button class="btn" onclick="save(true)">保存并发布</button>` : ""}
                </div>
            </div>`;
        document.getElementById("saveHint").textContent = dirty
          ? "有未保存的修改"
          : "";
        window.scrollTo(0, scrollY);
      }

      function questionHtml(q, i, ro) {
        const isChoice = q.type === "single" || q.type === "multiple";
        return `<div class="question-card">
            <div class="row-between">
                <strong>${i + 1}. ${TYPE_TEXT[q.type]}</strong>
                ${q.version ? `<span class="tag gray" title="该题来自题库，当前引用版本 v${q.version}；修改内容保存后将自动产生新版本">题库 v${q.version}</span>` : ""}
                ${
                  isDraft()
                    ? `<div style="display:flex;gap:6px">
                    <button class="btn btn-sm" onclick="moveQuestion(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button>
                    <button class="btn btn-sm" onclick="moveQuestion(${i},1)" ${i === survey.questions.length - 1 ? "disabled" : ""}>↓</button>
                    <button class="btn btn-sm btn-danger" onclick="removeQuestion(${i})">删除</button>
                </div>`
                    : ""
                }
            </div>
            <div class="field" style="margin-top:10px"><label>题目标题</label>
                <input type="text" value="${escapeHtml(q.title)}" ${ro} onchange="updateQuestion(${i},'title',this.value)"></div>
            <label><input type="checkbox" ${q.required ? "checked" : ""} ${ro} style="width:auto" onchange="updateQuestion(${i},'required',this.checked)"> 必答</label>
            ${
              isChoice
                ? `<div style="margin-top:10px"><label class="muted">选项</label>
                ${q.options
                  .map(
                    (o, j) => `<div class="option-row">
                    <input type="text" value="${escapeHtml(o.text)}" ${ro} onchange="updateOption(${i},${j},this.value)">
                    ${isDraft() ? `<button class="btn btn-sm btn-danger" onclick="removeOption(${i},${j})">×</button>` : ""}
                </div>`,
                  )
                  .join("")}
                ${isDraft() ? `<button class="btn btn-sm" onclick="addOption(${i})">+ 添加选项</button>` : ""}
            </div>`
                : ""
            }
            ${constraintHtml(q, i, ro)}
        </div>`;
      }

      function constraintHtml(q, i, ro) {
        const c = q.constraints || {};
        const num = (key, label) => `<div><label class="muted">${label}</label>
            <input type="number" step="any" value="${c[key] ?? ""}" ${ro} onchange="updateConstraint(${i},'${key}',this.value)"></div>`;
        if (q.type === "multiple") {
          return `<div class="constraint-grid">${num("minSelect", "最少选")}${num("maxSelect", "最多选")}</div>`;
        }
        if (q.type === "text") {
          return `<div class="constraint-grid">${num("minLength", "最少字数")}${num("maxLength", "最多字数")}</div>`;
        }
        if (q.type === "number") {
          return `<div class="constraint-grid">${num("min", "最小值")}${num("max", "最大值")}
                <div><label class="muted">仅限整数</label><label><input type="checkbox" ${c.integerOnly ? "checked" : ""} ${ro} style="width:auto" onchange="updateConstraint(${i},'integerOnly',this.checked)"> 开启</label></div></div>`;
        }
        return "";
      }

      function ruleHtml(r, i, ro) {
        const condQuestions = survey.questions.filter(
          (q) => OPS_BY_TYPE[q.type],
        );
        const whenQ = survey.questions.find((q) => q.qid === r.when.qid);
        const ops = whenQ ? OPS_BY_TYPE[whenQ.type] : [];
        const targets = survey.questions.filter(
          (q) =>
            survey.questions.indexOf(q) >
            survey.questions.findIndex((x) => x.qid === r.when.qid),
        );
        return `<div class="question-card">
            <div class="row-between">
                <strong>规则 ${i + 1}</strong>
                ${isDraft() ? `<button class="btn btn-sm btn-danger" onclick="removeRule(${i})">删除</button>` : ""}
            </div>
            <div class="constraint-grid" style="align-items:end">
                <div><label class="muted">当题目</label>
                    <select ${ro} onchange="updateRuleWhen(${i},'qid',this.value)">
                        ${condQuestions.map((q) => `<option value="${q.qid}" ${q.qid === r.when.qid ? "selected" : ""}>${escapeHtml(q.title)}</option>`).join("")}
                    </select></div>
                <div><label class="muted">满足</label>
                    <select ${ro} onchange="updateRuleWhen(${i},'op',this.value)">
                        ${ops.map((o) => `<option value="${o.v}" ${o.v === r.when.op ? "selected" : ""}>${o.t}</option>`).join("")}
                    </select></div>
                <div><label class="muted">值</label>
                    ${ruleValueInput(r, i, ro, whenQ)}</div>
                <div><label class="muted">则</label>
                    <select ${ro} onchange="updateRuleAction(${i},this.value)">
                        <option value="jumpTo" ${r.then.action === "jumpTo" ? "selected" : ""}>跳转到</option>
                        <option value="end" ${r.then.action === "end" ? "selected" : ""}>直接结束</option>
                    </select></div>
                ${
                  r.then.action === "jumpTo"
                    ? `<div><label class="muted">目标题</label>
                    <select ${ro} onchange="updateRuleTarget(${i},this.value)">
                        ${targets.map((q) => `<option value="${q.qid}" ${q.qid === r.then.targetQid ? "selected" : ""}>${escapeHtml(q.title)}</option>`).join("")}
                    </select></div>`
                    : "<div></div>"
                }
            </div>
        </div>`;
      }

      function ruleValueInput(r, i, ro, whenQ) {
        if (!whenQ) return '<input type="text" disabled>';
        if (whenQ.type === "single" && r.when.op === "eq") {
          return `<select ${ro} onchange="updateRuleWhen(${i},'value',this.value)">
                ${whenQ.options.map((o) => `<option value="${o.oid}" ${o.oid === r.when.value ? "selected" : ""}>${escapeHtml(o.text)}</option>`).join("")}</select>`;
        }
        if (whenQ.type === "single" && r.when.op === "in") {
          return `<input type="text" value="${escapeHtml((r.when.value || []).join ? r.when.value.join(",") : r.when.value)}" ${ro} placeholder="选项值，逗号分隔" onchange="updateRuleWhen(${i},'value',this.value.split(',').map(s=>s.trim()).filter(Boolean))">`;
        }
        if (whenQ.type === "multiple" && r.when.op === "contains") {
          return `<select ${ro} onchange="updateRuleWhen(${i},'value',this.value)">
                ${whenQ.options.map((o) => `<option value="${o.oid}" ${o.oid === r.when.value ? "selected" : ""}>${escapeHtml(o.text)}</option>`).join("")}</select>`;
        }
        if (whenQ.type === "multiple" && r.when.op === "containsAll") {
          return `<input type="text" value="${escapeHtml((r.when.value || []).join ? r.when.value.join(",") : r.when.value)}" ${ro} placeholder="选项值，逗号分隔" onchange="updateRuleWhen(${i},'value',this.value.split(',').map(s=>s.trim()).filter(Boolean))">`;
        }
        if (r.when.op === "between") {
          const v = Array.isArray(r.when.value) ? r.when.value : ["", ""];
          return `<div style="display:flex;gap:6px">
                <input type="number" step="any" value="${v[0]}" ${ro} onchange="updateRuleBetween(${i},0,this.value)">
                <input type="number" step="any" value="${v[1]}" ${ro} onchange="updateRuleBetween(${i},1,this.value)"></div>`;
        }
        return `<input type="number" step="any" value="${r.when.value ?? ""}" ${ro} onchange="updateRuleWhen(${i},'value',parseFloat(this.value))">`;
      }

      /* ========== 状态修改 ========== */

      function addQuestion(type) {
        const q = {
          qid: newId(),
          type,
          title: "",
          required: true,
          options: [],
          constraints: {},
        };
        if (type === "single" || type === "multiple") {
          q.options = [
            { oid: newId(), text: "选项1" },
            { oid: newId(), text: "选项2" },
          ];
        }
        survey.questions.push(q);
        markDirty();
        render();
        // 滚动到新题卡片并聚焦标题输入框，方便直接填写
        const cards = document.querySelectorAll("#questionList .question-card");
        const card = cards[cards.length - 1];
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          const input = card.querySelector('input[type="text"]');
          if (input) input.focus();
        }
      }

      function removeQuestion(i) {
        const qid = survey.questions[i].qid;
        survey.questions.splice(i, 1);
        survey.logic = survey.logic.filter(
          (r) => r.when.qid !== qid && r.then.targetQid !== qid,
        );
        markDirty();
        render();
      }

      function moveQuestion(i, dir) {
        const j = i + dir;
        [survey.questions[i], survey.questions[j]] = [
          survey.questions[j],
          survey.questions[i],
        ];
        markDirty();
        render();
      }

      function updateQuestion(i, key, value) {
        survey.questions[i][key] = value;
        markDirty();
      }

      function addOption(i) {
        survey.questions[i].options.push({
          oid: newId(),
          text: "选项" + (survey.questions[i].options.length + 1),
        });
        markDirty();
        render();
      }

      function removeOption(i, j) {
        survey.questions[i].options.splice(j, 1);
        markDirty();
        render();
      }

      function updateOption(i, j, text) {
        survey.questions[i].options[j].text = text;
        markDirty();
      }

      function updateConstraint(i, key, value) {
        const c = (survey.questions[i].constraints =
          survey.questions[i].constraints || {});
        if (value === "" || value == null) delete c[key];
        else if (key === "integerOnly") c[key] = !!value;
        else c[key] = parseFloat(value);
        markDirty();
      }

      function addRule() {
        const cond = survey.questions.find((q) => OPS_BY_TYPE[q.type]);
        if (!cond) {
          showNotice("请先添加单选、多选或数字题");
          return;
        }
        const target = survey.questions.find(
          (q) => survey.questions.indexOf(q) > survey.questions.indexOf(cond),
        );
        survey.logic.push({
          id: newId(),
          when: {
            qid: cond.qid,
            op: OPS_BY_TYPE[cond.type][0].v,
            value: defaultValue(cond),
          },
          then: {
            action: target ? "jumpTo" : "end",
            targetQid: target ? target.qid : null,
          },
        });
        markDirty();
        render();
      }

      function defaultValue(q) {
        if (q.type === "single") return q.options[0] ? q.options[0].oid : "";
        if (q.type === "multiple") return q.options[0] ? q.options[0].oid : "";
        return 0;
      }

      function removeRule(i) {
        survey.logic.splice(i, 1);
        markDirty();
        render();
      }

      function updateRuleWhen(i, key, value) {
        survey.logic[i].when[key] = value;
        if (key === "qid" || key === "op") {
          const q = survey.questions.find(
            (x) => x.qid === survey.logic[i].when.qid,
          );
          if (key === "qid") {
            survey.logic[i].when.op = OPS_BY_TYPE[q.type][0].v;
            survey.logic[i].when.value = defaultValue(q);
          }
          if (survey.logic[i].when.op === "between")
            survey.logic[i].when.value = [0, 100];
        }
        markDirty();
        render();
      }

      function updateRuleAction(i, action) {
        const r = survey.logic[i];
        r.then.action = action;
        if (action === "jumpTo") {
          const t = survey.questions.find(
            (q) =>
              survey.questions.indexOf(q) >
              survey.questions.findIndex((x) => x.qid === r.when.qid),
          );
          r.then.targetQid = t ? t.qid : null;
        } else r.then.targetQid = null;
        markDirty();
        render();
      }

      function updateRuleTarget(i, qid) {
        survey.logic[i].then.targetQid = qid;
        markDirty();
      }

      function updateRuleBetween(i, idx, value) {
        const v = Array.isArray(survey.logic[i].when.value)
          ? [...survey.logic[i].when.value]
          : [0, 0];
        v[idx] = parseFloat(value);
        survey.logic[i].when.value = v;
        markDirty();
      }

      /* ========== 保存 ========== */

      let dirty = false;
      function markDirty() {
        dirty = true;
        document.getElementById("saveHint").textContent = "有未保存的修改";
      }

      function collectMeta() {
        survey.title = document.getElementById("fTitle").value.trim();
        survey.description = document.getElementById("fDesc").value.trim();
        survey.settings.allowAnonymous =
          document.getElementById("fAnon").checked;
        survey.settings.allowMultiple =
          document.getElementById("fMulti").checked;
        const dl = document.getElementById("fDeadline").value;
        survey.settings.deadline = dl ? new Date(dl).toISOString() : null;
      }

      async function save(publish = false) {
        collectMeta();
        const body = {
          title: survey.title,
          description: survey.description,
          settings: survey.settings,
        };
        if (isDraft()) {
          body.questions = survey.questions;
          body.logic = survey.logic;
        }
        try {
          const saved = await api(`/api/surveys/${SURVEY_ID}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
          survey = saved;
          dirty = false;
          if (publish) {
            survey = await api(`/api/surveys/${SURVEY_ID}/publish`, {
              method: "POST",
            });
            showNotice("已发布", "success");
          }
          render();
        } catch (e) {
          showNotice(e.message);
        }
      }

      function toLocalInput(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      /* ========== 题库选题 ========== */

      let libItems = [];

      async function openLibrary() {
        document.getElementById("libModal").style.display = "block";
        const box = document.getElementById("libList");
        box.innerHTML = "加载中…";
        try {
          const [mine, shared] = await Promise.all([
            api("/api/items"),
            api("/api/items/shared"),
          ]);
          libItems = [...mine, ...shared.filter((it) => !it.mine)];
          if (!libItems.length) {
            box.innerHTML = `<div class="muted">题库还是空的，可先到 <a href="/library" target="_blank">题库页</a> 新建题目</div>`;
            return;
          }
          box.innerHTML = libItems
            .map(
              (it) => `<div class="row-between" style="padding:10px 0;border-bottom:1px solid #f0eee8">
                <div>
                    <strong>${escapeHtml(it.title)}</strong>
                    <span class="tag" style="margin-left:8px">${TYPE_TEXT[it.type] || it.type}</span>
                    <span class="tag gray">v${it.currentVersion}</span>
                    ${it.mine ? "" : '<span class="tag gray">共享</span>'}
                </div>
                <button class="btn btn-sm btn-primary" onclick="pickItem('${it.id}')">选用</button>
            </div>`,
            )
            .join("");
        } catch (e) {
          box.textContent = e.message;
        }
      }

      function closeLibrary() {
        document.getElementById("libModal").style.display = "none";
      }

      function pickItem(id) {
        const it = libItems.find((x) => x.id === id);
        if (!it) return;
        survey.questions.push({
          qid: newId(),
          itemId: it.id,
          versionId: it.currentVersionId,
          version: it.currentVersion,
          type: it.type,
          title: it.title,
          required: it.required,
          options: (it.options || []).map((o) => ({ oid: o.oid, text: o.text })),
          constraints: it.constraints || {},
        });
        closeLibrary();
        markDirty();
        render();
        const cards = document.querySelectorAll("#questionList .question-card");
        const card = cards[cards.length - 1];
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      /* ========== 入口 ========== */

      api(`/api/surveys/${SURVEY_ID}`)
        .then((s) => {
          survey = s;
          render();
        })
        .catch((e) => showNotice(e.message));
    </script>
  </body>
</html>
