<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>填写问卷</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="container">
    <div id="notice" class="notice"></div>
    <div id="app"></div>
</div>
<input type="hidden" id="shareCode" th:value="${shareCode}">
<script src="/js/common.js"></script>
<script>
    const SHARE_CODE = document.getElementById('shareCode').value;
    const RID_KEY = 'response_' + SHARE_CODE;

    let survey = null;       // 公开问卷信息
    let responseId = localStorage.getItem(RID_KEY);
    let currentQid = null;

    const app = document.getElementById('app');

    function questionByQid(qid) {
        return survey.questions.find(q => q.qid === qid);
    }

    function questionPosition(qid) {
        return survey.questions.findIndex(q => q.qid === qid) + 1;
    }

    /** 渲染当前题目 */
    function renderQuestion() {
        const q = questionByQid(currentQid);
        if (!q) { renderSubmit(); return; }
        let inputHtml = '';
        if (q.type === 'single') {
            inputHtml = '<div class="fill-options">' + q.options.map(o =>
                `<label><input type="radio" name="opt" value="${escapeHtml(o.oid)}"><span>${escapeHtml(o.text)}</span></label>`
            ).join('') + '</div>';
        } else if (q.type === 'multiple') {
            const hint = constraintHint(q);
            inputHtml = '<div class="fill-options">' + q.options.map(o =>
                `<label><input type="checkbox" name="opt" value="${escapeHtml(o.oid)}"><span>${escapeHtml(o.text)}</span></label>`
            ).join('') + '</div>' + (hint ? `<div class="muted">${hint}</div>` : '');
        } else if (q.type === 'text') {
            inputHtml = `<textarea id="textAnswer" placeholder="请输入..."></textarea>`;
        } else if (q.type === 'number') {
            const hint = constraintHint(q);
            inputHtml = `<input type="number" id="numberAnswer" step="any">` + (hint ? `<div class="muted" style="margin-top:6px">${hint}</div>` : '');
        }
        app.innerHTML = `<div class="card">
            <div class="progress-text">第 ${questionPosition(q.qid)} / ${survey.questions.length} 题</div>
            <h3 style="margin:0 0 4px">${escapeHtml(q.title)} ${q.required ? '<span style="color:var(--danger)">*</span>' : ''}</h3>
            <div style="margin:16px 0 20px">${inputHtml}</div>
            <button class="btn btn-primary" onclick="saveAndNext()">下一题</button>
        </div>`;
    }

    function constraintHint(q) {
        const c = q.constraints || {};
        if (q.type === 'multiple') {
            if (c.minSelect != null && c.maxSelect != null && c.minSelect === c.maxSelect) return `请选择 ${c.minSelect} 项`;
            const parts = [];
            if (c.minSelect != null) parts.push(`至少 ${c.minSelect} 项`);
            if (c.maxSelect != null) parts.push(`最多 ${c.maxSelect} 项`);
            return parts.join('，');
        }
        if (q.type === 'number') {
            const parts = [];
            if (c.min != null) parts.push(`不小于 ${c.min}`);
            if (c.max != null) parts.push(`不大于 ${c.max}`);
            if (c.integerOnly) parts.push('仅限整数');
            return parts.join('，');
        }
        return '';
    }

    /** 收集当前答案并保存，然后进入下一题 */
    async function saveAndNext() {
        const q = questionByQid(currentQid);
        const body = { qid: q.qid };
        if (q.type === 'single') {
            const checked = document.querySelector('input[name="opt"]:checked');
            if (checked) body.optionIds = [checked.value];
        } else if (q.type === 'multiple') {
            const checked = [...document.querySelectorAll('input[name="opt"]:checked')].map(el => el.value);
            if (checked.length) body.optionIds = checked;
        } else if (q.type === 'text') {
            const v = document.getElementById('textAnswer').value.trim();
            if (v) body.text = v;
        } else if (q.type === 'number') {
            const v = document.getElementById('numberAnswer').value;
            if (v !== '') body.number = parseFloat(v);
        }
        try {
            const resp = await api(`/api/s/${SHARE_CODE}/responses/${responseId}/answers`, {
                method: 'POST', body: JSON.stringify(body)
            });
            currentQid = resp.nextQid;
            if (resp.done) renderSubmit(); else renderQuestion();
        } catch (e) { showNotice(e.message); }
    }

    /** 已答完所有题：展示提交按钮 */
    function renderSubmit() {
        app.innerHTML = `<div class="card center">
            <h3>已答完全部题目</h3>
            <p class="muted">提交后将不能修改，请确认。</p>
            <button class="btn btn-primary" onclick="submitResponse()">提交问卷</button>
        </div>`;
    }

    async function submitResponse() {
        try {
            await api(`/api/s/${SHARE_CODE}/responses/${responseId}/submit`, { method: 'POST' });
            localStorage.removeItem(RID_KEY);
            app.innerHTML = `<div class="card center">
                <h3>提交成功</h3>
                <p class="muted">感谢你的参与！</p>
            </div>`;
        } catch (e) { showNotice(e.message); }
    }

    /** 入口：加载问卷 -> 开始/恢复答卷 -> 渲染当前题 */
    async function init() {
        try {
            survey = await api(`/api/s/${SHARE_CODE}`);
        } catch (e) {
            app.innerHTML = `<div class="card center"><h3>${escapeHtml(e.message)}</h3></div>`;
            return;
        }
        document.title = survey.title;
        try {
            // 匿名用户凭 localStorage 中的 responseId 恢复进度
            if (responseId) {
                try {
                    const state = await api(`/api/s/${SHARE_CODE}/responses/${responseId}`);
                    if (state.status === 'DRAFT') {
                        currentQid = state.currentQid;
                        renderHeader();
                        currentQid ? renderQuestion() : renderSubmit();
                        return;
                    }
                } catch { localStorage.removeItem(RID_KEY); responseId = null; }
            }
            const start = await api(`/api/s/${SHARE_CODE}/responses`, { method: 'POST' });
            responseId = start.responseId;
            localStorage.setItem(RID_KEY, responseId);
            currentQid = start.currentQid;
            renderHeader();
            currentQid ? renderQuestion() : renderSubmit();
        } catch (e) {
            app.innerHTML = `<div class="card center"><h3>${escapeHtml(e.message)}</h3></div>`;
        }
    }

    function renderHeader() {
        // 问卷标题说明插在答题卡片前（只渲染一次）
        const header = document.createElement('div');
        header.className = 'card';
        header.id = 'surveyHeader';
        header.innerHTML = `<h2 style="margin:0">${escapeHtml(survey.title)}</h2>
            ${survey.description ? `<p class="muted" style="margin:8px 0 0">${escapeHtml(survey.description)}</p>` : ''}`;
        app.innerHTML = '';
        app.appendChild(header);
    }

    init();
</script>
</body>
</html>
